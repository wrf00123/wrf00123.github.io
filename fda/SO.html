<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SO机型对照检索系统</title>
<style>
:root{
  --bg:#f4f6fb; --panel:#ffffff; --panel-2:#f8fafc; --text:#1e293b; --text-dim:#64748b;
  --border:#e2e8f0; --accent:#4f46e5; --accent-soft:#eef2ff; --mark:#fde68a; --mark-text:#1e293b;
  --row-hover:#f1f5f9; --shadow:0 1px 3px rgba(0,0,0,.08); --good:#16a34a; --warn:#dc2626;
  --chip:#eef2ff; --chip-text:#4338ca;
}
html[data-theme="dark"]{
  --bg:#0f141b; --panel:#161d27; --panel-2:#1b2530; --text:#e6edf3; --text-dim:#8b98a9;
  --border:#28333f; --accent:#818cf8; --accent-soft:#1e2a44; --mark:#facc15; --mark-text:#1e293b;
  --row-hover:#1e2733; --shadow:0 1px 3px rgba(0,0,0,.45); --good:#4ade80; --warn:#f87171;
  --chip:#22304d; --chip-text:#a5b4fc;
}
*{box-sizing:border-box;}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;}
a{color:var(--accent);}
button,select,input{font-family:inherit;font-size:inherit;color:var(--text);}
header{position:sticky;top:0;z-index:30;background:var(--panel);border-bottom:1px solid var(--border);
  padding:12px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:var(--shadow);}
header h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.3px;display:flex;align-items:center;gap:8px;}
header h1 .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft);}
.spacer{flex:1;}
.btn{background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:7px 12px;cursor:pointer;
  transition:.15s;display:inline-flex;align-items:center;gap:6px;font-weight:500;}
.btn:hover{border-color:var(--accent);color:var(--accent);}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);}
.btn.primary:hover{filter:brightness(1.08);color:#fff;}
.btn.ghost{background:transparent;}
select,.input{background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:7px 10px;outline:none;transition:.15s;}
select:focus,.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
.input{min-width:0;}
.wrap{max-width:1280px;margin:0 auto;padding:16px 18px 60px;}
.tabs{display:flex;gap:6px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:4px;margin-bottom:14px;width:fit-content;}
.tab{padding:7px 16px;border-radius:7px;cursor:pointer;font-weight:600;color:var(--text-dim);border:none;background:transparent;}
.tab.active{background:var(--accent);color:#fff;}
.card{background:var(--panel);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:16px;margin-bottom:14px;}
.search-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.search-box{flex:1;min-width:240px;display:flex;gap:8px;align-items:center;}
.search-box .input{flex:1;}
.kbd{font-size:11px;border:1px solid var(--border);border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:var(--text-dim);background:var(--panel-2);}
.adv-toggle{cursor:pointer;color:var(--accent);font-weight:600;user-select:none;display:inline-flex;align-items:center;gap:6px;}
.advanced{margin-top:14px;border-top:1px dashed var(--border);padding-top:14px;display:none;}
.advanced.open{display:block;}
.quick-row{display:flex;gap:14px 18px;flex-wrap:wrap;margin-top:14px;align-items:flex-end;}
.quick-row .qf{display:flex;flex-direction:column;gap:5px;}
.quick-row .qf label{font-size:12px;color:var(--text-dim);font-weight:600;}
.quick-row .qf .input{width:auto;min-width:120px;}
.quick-row .dr{display:flex;align-items:center;gap:6px;}
.quick-row .dr .input{width:auto;}
.grp-keys{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.gk{padding:5px 12px;border:1px solid var(--border);border-radius:8px;cursor:pointer;font-size:12px;font-weight:600;color:var(--text-dim);background:var(--panel-2);}
.gk.on{background:var(--accent);color:#fff;border-color:var(--accent);}
.filter-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;}
.field{display:flex;flex-direction:column;gap:5px;}
.field label{font-size:12px;color:var(--text-dim);font-weight:600;}
.field .line{display:flex;gap:6px;}
.field .line .input{flex:1;}
.field .line select{flex:0 0 84px;}
.type-chips{display:flex;flex-wrap:wrap;gap:6px;}
.type-chip{padding:5px 11px;border-radius:20px;border:1px solid var(--border);cursor:pointer;font-size:12px;font-weight:600;color:var(--text-dim);background:var(--panel-2);user-select:none;}
.type-chip.on{background:var(--accent);color:#fff;border-color:var(--accent);}
.summary{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;font-size:13px;color:var(--text-dim);}
.summary b{color:var(--text);}
.chips{display:flex;gap:6px;flex-wrap:wrap;}
.fchip{background:var(--chip);color:var(--chip-text);border-radius:18px;padding:3px 10px;font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:6px;}
.fchip span.x{cursor:pointer;opacity:.7;}
.fchip span.x:hover{opacity:1;}
.table-scroll{overflow-x:auto;border-radius:12px;border:1px solid var(--border);}
table{border-collapse:collapse;width:100%;font-size:13px;background:var(--panel);}
thead th{position:sticky;top:0;background:var(--panel-2);text-align:left;padding:10px 12px;border-bottom:1px solid var(--border);
  font-weight:700;color:var(--text-dim);white-space:nowrap;cursor:pointer;user-select:none;position:-webkit-sticky;}
thead th .arr{opacity:.4;font-size:10px;margin-left:4px;}
thead th.sorted .arr{opacity:1;color:var(--accent);}
tbody td{padding:9px 12px;border-bottom:1px solid var(--border);white-space:nowrap;}
tbody tr:hover{background:var(--row-hover);}
tbody td.so-cell{font-weight:600;color:var(--accent);}
.col-toggle{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.col-toggle .ct{padding:4px 9px;border:1px solid var(--border);border-radius:7px;font-size:12px;cursor:pointer;color:var(--text-dim);background:var(--panel-2);}
.col-toggle .ct.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);font-weight:600;}
mark{background:var(--mark);color:var(--mark-text);border-radius:3px;padding:0 1px;}
.pager{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px;}
.pager .pgbtn{padding:6px 11px;border:1px solid var(--border);border-radius:8px;cursor:pointer;background:var(--panel-2);}
.pager .pgbtn:disabled{opacity:.4;cursor:not-allowed;}
.pager .pgbtn.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.pager input{width:60px;text-align:center;}
.empty{text-align:center;padding:50px 20px;color:var(--text-dim);}
.empty .big{font-size:40px;margin-bottom:8px;}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px;}
.kpi{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px;box-shadow:var(--shadow);}
.kpi .v{font-size:26px;font-weight:800;color:var(--accent);}
.kpi .l{font-size:12px;color:var(--text-dim);margin-top:4px;}
.chart-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;}
.chart-title{font-weight:700;margin-bottom:10px;font-size:14px;display:flex;align-items:center;justify-content:space-between;}
.chart-title .hint{font-size:11px;color:var(--text-dim);font-weight:500;}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;font-size:12px;}
.legend .li{display:flex;align-items:center;gap:6px;color:var(--text-dim);}
.legend .sw{width:11px;height:11px;border-radius:3px;}
.svg-chart{width:100%;height:auto;display:block;}
.group-card{border:1px solid var(--border);border-radius:12px;margin-bottom:10px;overflow:hidden;background:var(--panel);}
.group-head{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;}
.group-head:hover{background:var(--row-hover);}
.group-head .so{font-weight:800;color:var(--accent);font-size:15px;}
.group-head .meta{color:var(--text-dim);font-size:12px;display:flex;gap:14px;flex-wrap:wrap;}
.group-head .badge{background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:2px 9px;font-weight:700;font-size:12px;}
.group-head .caret{margin-left:auto;transition:.2s;color:var(--text-dim);}
.group-card.open .caret{transform:rotate(90deg);}
.group-body{display:none;border-top:1px solid var(--border);}
.group-card.open .group-body{display:block;}
.group-body table{font-size:13px;}
.group-body td.q{text-align:right;font-variant-numeric:tabular-nums;}
.help-modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:none;align-items:center;justify-content:center;padding:20px;}
.help-modal.open{display:flex;}
.help-box{background:var(--panel);border:1px solid var(--border);border-radius:14px;max-width:520px;width:100%;padding:22px;box-shadow:var(--shadow);}
.help-box h3{margin:0 0 12px;}
.help-box table{font-size:13px;}
.help-box td{border:none;padding:4px 8px;}
.help-box td:first-child{white-space:nowrap;width:140px;}
.close-x{float:right;cursor:pointer;color:var(--text-dim);font-size:20px;line-height:1;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);
  padding:10px 18px;border-radius:10px;font-weight:600;opacity:0;transition:.25s;z-index:200;pointer-events:none;box-shadow:var(--shadow);}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.row-actions{display:flex;gap:6px;}
.mini{padding:3px 8px;font-size:11px;border-radius:6px;border:1px solid var(--border);background:var(--panel-2);color:var(--text);cursor:pointer;white-space:nowrap;font-weight:600;}
.mini:hover{border-color:var(--accent);color:var(--accent);}
.col-num{text-align:right;font-variant-numeric:tabular-nums;}
.foot{color:var(--text-dim);font-size:12px;text-align:center;margin-top:24px;}
@media (max-width:640px){.wrap{padding:12px 10px 50px;}header h1{font-size:15px;}}
@media print{
  header,.tabs,.card.search,.pager,.col-toggle,.summary .fchip,.row-actions{display:none!important;}
  body{background:#fff;} .card{box-shadow:none;border:none;}
}
</style>
</head>
<body>
<header>
  <h1><span class="dot"></span>SO机型对照检索系统</h1>
  <div class="spacer"></div>
  <label style="font-size:12px;color:var(--text-dim);display:flex;align-items:center;gap:6px;">
    主题
    <select id="themeSel" class="input" style="padding:5px 8px;">
      <option value="auto">跟随系统</option>
      <option value="light">☀ 白天</option>
      <option value="dark">🌙 黑夜</option>
    </select>
  </label>
  <button class="btn ghost" id="importBtn" title="从Excel重新导入数据">⬆ 导入Excel</button>
  <button class="btn ghost" id="helpBtn" title="快捷键帮助">?</button>
</header>

<div class="wrap">
  <div class="tabs">
    <button class="tab active" data-view="list">🔍 检索</button>
    <button class="tab" data-view="group">🗂 分组</button>
    <button class="tab" data-view="stats">📊 统计</button>
  </div>

  <!-- SEARCH CARD -->
  <div class="card search">
    <div class="search-row">
      <div class="search-box">
        <input class="input" id="globalSearch" placeholder="全局搜索：SO单号 / 机型 / 类型…（按 / 聚焦）" autocomplete="off">
        <select id="qMode" class="input" style="flex:0 0 96px;">
          <option value="contains">包含</option>
          <option value="exact">精确</option>
          <option value="regex">正则</option>
        </select>
      </div>
      <button class="btn primary" id="searchBtn">搜索</button>
      <button class="btn" id="resetBtn">重置</button>
      <span class="adv-toggle" id="advToggle">▸ 高级筛选</span>
    </div>

    <div class="quick-row">
      <div class="qf"><label>SO单号</label><input class="input" id="fSo" placeholder="如 61024266"></div>
      <div class="qf"><label>机型</label><input class="input" id="fModel" placeholder="如 F5309A0"></div>
      <div class="qf"><label>凭证日期 起~止</label><div class="dr"><input class="input" id="fCdFrom" type="date"><span>~</span><input class="input" id="fCdTo" type="date"></div></div>
      <div class="qf"><label>交货日期 起~止</label><div class="dr"><input class="input" id="fDdFrom" type="date"><span>~</span><input class="input" id="fDdTo" type="date"></div></div>
      <div class="qf"><label>类型（可多选）</label><div class="type-chips" id="typeChips"></div></div>
    </div>

    <div class="advanced" id="advanced">
      <div class="filter-grid">
        <div class="field">
          <label>SO单号匹配方式</label>
          <select id="fSoMode" class="input"><option value="contains">包含</option><option value="exact">精确</option><option value="regex">正则</option></select>
        </div>
        <div class="field">
          <label>机型匹配方式</label>
          <select id="fModelMode" class="input"><option value="contains">包含</option><option value="exact">精确</option><option value="regex">正则</option></select>
        </div>
        <div class="field">
          <label>订单数量 最小 ~ 最大</label>
          <div class="line"><input class="input" id="fQtyMin" type="number" placeholder="0"><input class="input" id="fQtyMax" type="number" placeholder="999999"></div>
        </div>
        <div class="field">
          <label>显示选项</label>
          <label style="font-size:13px;color:var(--text);display:flex;align-items:center;gap:6px;font-weight:500;cursor:pointer;">
            <input type="checkbox" id="mergeChk" checked> 合并相同SO单号（还原合并单元格效果）
          </label>
        </div>
      </div>
    </div>
  </div>

  <!-- LIST VIEW -->
  <div id="view-list">
    <div class="summary">
      <span id="resultCount"></span>
      <div class="chips" id="filterChips"></div>
      <div style="flex:1"></div>
      <div class="col-toggle" id="colToggle"></div>
    </div>
    <div class="card" style="padding:0;overflow:hidden;">
      <div class="table-scroll">
        <table id="resultTable">
          <thead><tr id="headRow"></tr></thead>
          <tbody id="resultBody"></tbody>
        </table>
      </div>
    </div>
    <div class="pager" id="pager"></div>
  </div>

  <!-- GROUP VIEW -->
  <div id="view-group" style="display:none;">
    <div class="summary">
      <span id="groupCount"></span>
      <div class="grp-keys" id="grpKeys"></div>
      <div style="flex:1"></div>
      <label style="font-size:12px;color:var(--text-dim);display:flex;align-items:center;gap:6px;">
        <input type="checkbox" id="expandAll"> 全部展开
      </label>
    </div>
    <div id="groupList"></div>
  </div>

  <!-- STATS VIEW -->
  <div id="view-stats" style="display:none;">
    <div class="kpis" id="kpis"></div>
    <div class="chart-grid">
      <div class="card"><div class="chart-title">类型分布 <span class="hint">点击图例可筛选</span></div><div id="chartType"></div></div>
      <div class="card"><div class="chart-title">按月·凭证日期 订单数量趋势</div><div id="chartMonth"></div></div>
      <div class="card"><div class="chart-title">Top 10 SO单号·订单数量</div><div id="chartTop"></div></div>
    </div>
  </div>

  <div class="foot">数据来源：SO机型对照表.xlsx · 共 <span id="totalRec"></span> 条记录 · 单文件离线可用</div>
</div>

<input type="file" id="fileInput" accept=".xlsx,.xls" style="display:none;">

<div class="help-modal" id="helpModal">
  <div class="help-box">
    <span class="close-x" id="helpClose">×</span>
    <h3>快捷键 & 使用说明</h3>
    <table>
      <tr><td><span class="kbd">/</span></td><td>聚焦全局搜索框</td></tr>
      <tr><td><span class="kbd">Esc</span></td><td>清空搜索并失焦</td></tr>
      <tr><td><span class="kbd">Enter</span></td><td>在搜索框按回车执行搜索</td></tr>
      <tr><td>表头点击</td><td>按该列排序（再次点击切换升/降序）</td></tr>
      <tr><td>合并显示</td><td>列表视图下，连续相同 SO单号 自动合并单元格，还原原始表格效果</td></tr>
      <tr><td>统计视图</td><td>所有图表随当前筛选条件实时更新</td></tr>
      <tr><td>导入Excel</td><td>用新版本的对照表覆盖数据（需联网加载解析库）</td></tr>
    </table>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

const META = DATA.meta;
let RECORDS = DATA.records;
const COLS = [
  {key:'cd', label:'凭证日期', type:'date'},
  {key:'dd', label:'交货日期', type:'date'},
  {key:'so', label:'SO单号', type:'text'},
  {key:'model', label:'机型', type:'text'},
  {key:'type', label:'类型', type:'text'},
  {key:'qty', label:'订单数量', type:'num'},
];
const COLLABEL = Object.fromEntries(COLS.map(c=>[c.key,c.label]));
const state = {
  view:'list', q:'', qMode:'contains',
  so:'', soMode:'contains', model:'', modelMode:'contains',
  types:new Set(), cdFrom:'', cdTo:'', ddFrom:'', ddTo:'', qtyMin:'', qtyMax:'',
  sortKey:'id', sortDir:'asc', page:1, pageSize:25,
  visibleCols:new Set(COLS.map(c=>c.key)),
  mergeSO:true, groupKey:'so', expanded:new Set(), theme:'auto',
};

/* ---------- theme ---------- */
const safeStore={
  get(k){try{return localStorage.getItem(k);}catch(e){return null;}},
  set(k,v){try{localStorage.setItem(k,v);}catch(e){}}
};
function applyTheme(){
  const t = state.theme;
  let eff = t;
  if(t==='auto') eff = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';
  document.documentElement.setAttribute('data-theme', eff);
}
function initTheme(){
  const saved = safeStore.get('so_theme');
  if(saved) state.theme = saved;
  const sel=document.getElementById('themeSel'); if(sel) sel.value = state.theme;
  applyTheme();
}
document.getElementById('themeSel').addEventListener('change', e=>{
  state.theme = e.target.value; safeStore.set('so_theme', state.theme); applyTheme();
});
try{
  const mq = window.matchMedia('(prefers-color-scheme: dark)');
  const onSys = ()=>{ if(state.theme==='auto') applyTheme(); };
  if(mq.addEventListener) mq.addEventListener('change', onSys); else if(mq.addListener) mq.addListener(onSys);
}catch(e){}

/* ---------- helpers ---------- */
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1700);}
function matchMode(val, pat, mode){
  val = String(val==null?'':val).toLowerCase();
  if(mode==='exact') return val===pat;
  if(mode==='regex'){ try{return new RegExp(pat,'i').test(val);}catch(e){return false;} }
  return val.includes(pat);
}
function getFiltered(){
  let list = RECORDS.slice();
  const q = state.q.trim().toLowerCase();
  if(q){
    list = list.filter(r=>{
      const parts=[r.so,r.model,r.type];
      if(state.qMode==='exact') return parts.some(p=>String(p).toLowerCase()===q);
      if(state.qMode==='regex'){ try{return new RegExp(q,'i').test(parts.join(' '));}catch(e){return false;} }
      return parts.join(' ').toLowerCase().includes(q);
    });
  }
  if(state.so.trim()){const v=state.so.trim().toLowerCase();list=list.filter(r=>matchMode(r.so,v,state.soMode));}
  if(state.model.trim()){const v=state.model.trim().toLowerCase();list=list.filter(r=>matchMode(r.model,v,state.modelMode));}
  if(state.types.size) list=list.filter(r=>state.types.has(r.type));
  if(state.cdFrom) list=list.filter(r=>r.cd>=state.cdFrom);
  if(state.cdTo) list=list.filter(r=>r.cd<=state.cdTo);
  if(state.ddFrom) list=list.filter(r=>r.dd>=state.ddFrom);
  if(state.ddTo) list=list.filter(r=>r.dd<=state.ddTo);
  if(state.qtyMin!=='') list=list.filter(r=>r.qty>=Number(state.qtyMin));
  if(state.qtyMax!=='') list=list.filter(r=>r.qty<=Number(state.qtyMax));
  return list;
}
function sortList(list){
  const k=state.sortKey, dir=state.sortDir==='asc'?1:-1;
  list.sort((a,b)=>{
    let va=a[k], vb=b[k];
    if(k==='qty'){va=+va;vb=+vb;}
    if(va<vb) return -1*dir; if(va>vb) return 1*dir;
    return (a.id-b.id)*dir;
  });
}
function highlight(text, pat, mode){
  text = String(text==null?'':text);
  if(!pat) return esc(text);
  if(mode==='regex'){
    try{ const re=new RegExp('('+pat+')','ig'); return esc(text).replace(re,'<mark>$1</mark>'); }catch(e){return esc(text);}
  }
  if(mode==='exact'){
    if(text.toLowerCase()!==pat.toLowerCase()) return esc(text);
    return '<mark>'+esc(text)+'</mark>';
  }
  const i=text.toLowerCase().indexOf(pat.toLowerCase());
  if(i<0) return esc(text);
  return esc(text.slice(0,i))+'<mark>'+esc(text.slice(i,i+pat.length))+'</mark>'+esc(text.slice(i+pat.length));
}

/* ---------- rendering: list ---------- */
function renderHead(){
  const tr=$('headRow'); tr.innerHTML='';
  COLS.forEach(c=>{
    if(!state.visibleCols.has(c.key)) return;
    const th=document.createElement('th');
    th.className='col-'+(c.type==='num'?'num':'')+(state.sortKey===c.key?' sorted':'');
    th.innerHTML=esc(c.label)+'<span class="arr">'+(state.sortKey===c.key?(state.sortDir==='asc'?'▲':'▼'):'⇅')+'</span>';
    th.onclick=()=>{ if(state.sortKey===c.key){state.sortDir=state.sortDir==='asc'?'desc':'asc';}else{state.sortKey=c.key;state.sortDir='asc';} renderList(); };
    tr.appendChild(th);
  });
  // actions column
  const th=document.createElement('th'); th.textContent='操作'; th.style.cursor='default'; tr.appendChild(th);
}
function buildMerge(pageRows){
  const res=pageRows.map(()=>({show:true,rowspan:1}));
  let i=0;
  while(i<pageRows.length){
    let j=i;
    while(j+1<pageRows.length && pageRows[j+1].so===pageRows[i].so && pageRows[i].so!=='') j++;
    if(state.mergeSO && j>i && pageRows[i].so!==''){
      res[i]={show:true,rowspan:j-i+1};
      for(let k=i+1;k<=j;k++) res[k]={show:false,rowspan:0};
    }
    i=j+1;
  }
  return res;
}
function renderList(){
  renderHead();
  const filtered=getFiltered();
  sortList(filtered);
  const total=filtered.length;
  const ps=state.pageSize, pages=ps==='all'?1:Math.max(1,Math.ceil(total/ps));
  if(state.page>pages) state.page=pages;
  const start=(ps==='all')?0:(state.page-1)*ps;
  const end=(ps==='all')?total:start+ps;
  const pageRows=filtered.slice(start,end);
  const merge=buildMerge(pageRows);
  const body=$('resultBody'); body.innerHTML='';
  if(total===0){
    body.innerHTML='<tr><td colspan="99"><div class="empty"><div class="big">🔍</div>没有匹配的结果，试试调整筛选条件</div></td></tr>';
  } else {
    const pat=(state.qMode==='regex')?state.q:(state.qMode==='exact'?state.q:state.q).trim().toLowerCase();
    pageRows.forEach((r,idx)=>{
      const tr=document.createElement('tr');
      let html='';
      COLS.forEach(c=>{
        if(!state.visibleCols.has(c.key)) return;
        if(c.key==='so'){
          if(merge[idx].show){
            html+='<td class="so-cell" rowspan="'+merge[idx].rowspan+'">'+highlight(r.so, state.q.trim(), state.qMode==='regex'?'regex':'contains')+'</td>';
          }
        } else {
          let cls=c.type==='num'?'col-num':'';
          let val = (c.key==='qty')? r.qty.toLocaleString() : r[c.key];
          let hl = (c.key==='qty')? esc(r.qty.toLocaleString()) : highlight(val, state.q.trim(), (state.qMode==='regex'?'regex':(state.so&&c.key==='so')?'contains':'contains'));
          // highlight qty only on qty
          if(c.key==='qty') hl = highlight(r.qty.toLocaleString().replace(/,/g,''), state.q.trim(), state.qMode==='regex'?'regex':'contains');
          html+='<td class="'+cls+'">'+hl+'</td>';
        }
      });
      // actions
      html+='<td><div class="row-actions">'+
        '<button class="mini" data-cp="'+esc(r.so)+'">复制SO</button>'+
        '<button class="mini" data-det="'+r.id+'">详情</button></div></td>';
      tr.innerHTML=html;
      body.appendChild(tr);
    });
  }
  // actions events
  body.querySelectorAll('[data-cp]').forEach(b=>b.onclick=()=>{copyText(b.getAttribute('data-cp'));});

function renderPager(total,pages){

function legendHtml(data, fmt){
  return '<div class="legend">'+data.map((d,i)=>'<div class="li" data-label="'+esc(d.label)+'"><span class="sw" style="background:'+PALETTE[i%PALETTE.length]+'"></span>'+esc(d.label)+' · '+fmt(d).toLocaleString()+'</div>').join('')+'</div>';
}
const PALETTE=['#4f46e5','#06b6d4','#f59e0b','#ef4444','#10b981','#8b5cf6','#ec4899','#84cc16'];
function donut(data){
  const total=data.reduce((s,d)=>s+d.value,0)||1;
  const cx=90,cy=90,r=70,ir=44; let ang=-Math.PI/2; const segs=[];
  if(data.length===1){
    segs.push(`<circle cx="${cx}" cy="${cy}" r="${(r+ir)/2}" fill="none" stroke="${PALETTE[0]}" stroke-width="${r-ir}"/>`);
  } else {
    data.forEach((d,i)=>{
      const a2=ang+ (d.value/total)*Math.PI*2;
      segs.push(arcSeg(cx,cy,r,ir,ang,a2,PALETTE[i%PALETTE.length]));
      ang=a2;
    });
  }
  const pct=total? '':'';
  return `<svg class="svg-chart" viewBox="0 0 180 180" style="max-width:220px;margin:0 auto;">${segs.join('')}<text x="90" y="85" text-anchor="middle" font-size="13" fill="var(--text-dim)">总数</text><text x="90" y="105" text-anchor="middle" font-size="18" font-weight="800" fill="var(--text)">${total.toLocaleString()}</text></svg>`;
}
function arcSeg(cx,cy,r,ir,a1,a2,color){
  const x1=cx+r*Math.cos(a1), y1=cy+r*Math.sin(a1);
  const x2=cx+r*Math.cos(a2), y2=cy+r*Math.sin(a2);
  const xi2=cx+ir*Math.cos(a2), yi2=cy+ir*Math.sin(a2);
  const xi1=cx+ir*Math.cos(a1), yi1=cy+ir*Math.sin(a1);
  const large=(a2-a1)>Math.PI?1:0;
  return `<path d="M ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2} L ${xi2} ${yi2} A ${ir} ${ir} 0 ${large} 0 ${xi1} ${yi1} Z" fill="${color}"/>`;
}
function barChart(data,unit){
  if(!data.length) return '<div class="empty">无数据</div>';
  const W=520,H=240,pl=40,pr=10,pt=10,pb=50;
  const max=Math.max(...data.map(d=>d.value))||1;
  const n=data.length, bw=Math.min(34,(W-pl-pr)/n*0.7), gap=(W-pl-pr)/n;
  let s=`<svg class="svg-chart" viewBox="0 0 ${W} ${H}">`;
  // y grid
  for(let g=0;g<=4;g++){const y=pt+(H-pt-pb)*g/4; const v=Math.round(max*(1-g/4)); s+=`<line x1="${pl}" y1="${y}" x2="${W-pr}" y2="${y}" stroke="var(--border)" stroke-width="1"/><text x="${pl-5}" y="${y+3}" text-anchor="end" font-size="9" fill="var(--text-dim)">${v.toLocaleString()}</text>`;}
  data.forEach((d,i)=>{
    const x=pl+gap*i+(gap-bw)/2; const h=(H-pt-pb)*(d.value/max); const y=H-pb-h;
    s+=`<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="3" fill="${PALETTE[i%2? 1:0]}"/>`;
    s+=`<text x="${x+bw/2}" y="${y-4}" text-anchor="middle" font-size="9" fill="var(--text-dim)">${d.value.toLocaleString()}</text>`;
    s+=`<text x="${x+bw/2}" y="${H-pb+14}" text-anchor="middle" font-size="9" fill="var(--text-dim)">${d.label}</text>`;
  });
  s+=`</svg>`; return s;
}
function hbar(data,unit){
  if(!data.length) return '<div class="empty">无数据</div>';
  const W=520, rowH=26, pl=70, pr=50, pt=6;
  const max=Math.max(...data.map(d=>d.value))||1;
  const H=pt+data.length*rowH+6;
  let s=`<svg class="svg-chart" viewBox="0 0 ${W} ${H}">`;
  data.forEach((d,i)=>{
    const y=pt+i*rowH; const w=(W-pl-pr)*(d.value/max);
    s+=`<text x="${pl-8}" y="${y+rowH/2+3}" text-anchor="end" font-size="10" fill="var(--text)">${esc(d.label)}</text>`;
    s+=`<rect x="${pl}" y="${y+3}" height="${rowH-8}" width="${Math.max(2,w)}" rx="3" fill="${PALETTE[i%PALETTE.length]}"/>`;
    s+=`<text x="${pl+w+6}" y="${y+rowH/2+3}" font-size="10" fill="var(--text-dim)">${d.value.toLocaleString()}</text>`;
  });
  s+=`</svg>`; return s;
}

  if(typeof XLSX==='undefined'){toast('解析库未就绪');return;}
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const wb=XLSX.read(ev.target.result,{type:'array'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:null,raw:false});
      // find header row
      let hi=-1; for(let i=0;i<rows.length;i++){const r=rows[i].map(x=>String(x==null?'':x).trim());if(r.includes('SO单号')&&r.includes('机型')){hi=i;break;}}
      if(hi<0){toast('未找到表头（需含 SO单号/机型）');return;}
      const head=rows[hi].map(x=>String(x==null?'':x).trim());
      const ci=head.indexOf('SO单号'), mi=head.indexOf('机型'), ti=head.indexOf('类型'), qi=head.indexOf('订单数量'), cdi=head.indexOf('凭证日期'), ddi=head.indexOf('交货日期');
      const out=[]; let rid=0;
      for(let i=hi+1;i<rows.length;i++){const row=rows[i]; const so=row[ci], model=row[mi]; if((so==null||so==='')&&(model==null||model===''))continue;
        rid++;
        const get=(idx)=>row[idx]==null?'':String(row[idx]).trim();
        out.push({id:rid,cd:get(cdi),dd:get(ddi),so:get(ci),model:get(mi),type:get(ti),qty:parseInt(get(qi))||0});
      }
      RECORDS=out; META.types=[...new Set(out.map(r=>r.type))].filter(Boolean);
      state.page=1; syncTypeChips(); renderCurrent(); $('totalRec').textContent=RECORDS.length;
      toast('已导入 '+out.length+' 条（合并单元格需先取消合并再导入）');
    }catch(err){toast('导入失败：'+err.message);}
  };
  reader.readAsArrayBuffer(f); e.target.value='';
});

/* ---------- init ---------- */
$('totalRec').textContent=RECORDS.length;
// set date inputs min/max from meta
['fCdFrom','fCdTo'].forEach(id=>{$(id).min=META.cdMin;$(id).max=META.cdMax;});
['fDdFrom','fDdTo'].forEach(id=>{$(id).min=META.ddMin;$(id).max=META.ddMax;});
initTheme(); syncTypeChips(); renderColToggle(); renderGroupKeys(); renderCurrent();
const mc=$('mergeChk'); if(mc){ mc.checked=state.mergeSO; mc.addEventListener('change',e=>{state.mergeSO=e.target.checked;renderList();}); }
</script>
</body>
</html>
