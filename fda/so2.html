<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes" />
    <title>DHR 记录核对 · 流程演示</title>
    <style>
        /* ============================================================
                   CSS Variables & Reset
                   ============================================================ */
        :root {
            --bg-body: #f0f4f9;
            --bg-card: #ffffff;
            --bg-header: #ffffff;
            --bg-footer: #ffffff;
            --bg-progress-track: #e9edf2;
            --bg-input: #f0f2f5;
            --bg-hover: #f5f8fc;
            --bg-checked: #e8f5e9;
            --bg-card-header: #f5f9ff;
            --text-primary: #1a2332;
            --text-secondary: #4a5a72;
            --text-muted: #8a9bb0;
            --border-color: #dce3ec;
            --shadow-card: 0 4px 16px rgba(0, 0, 0, 0.06);
            --shadow-hover: 0 8px 28px rgba(0, 0, 0, 0.10);
            --accent: #2a7de1;
            --accent-hover: #1a5fb5;
            --accent-light: #dce8f8;
            --accent-text: #1a5fb5;
            --success: #2e9d5e;
            --success-bg: #e0f2e6;
            --success-light: #4caf7a;
            --danger: #d34a4a;
            --danger-bg: #fde8e8;
            --warning: #d49c2a;
            --warning-bg: #fdf3e0;
            --radius: 14px;
            --radius-sm: 10px;
            --radius-xs: 6px;
            --transition: 0.25s ease;
            --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
            --max-width: 820px;
            --header-blur: rgba(255, 255, 255, 0.88);
        }

        [data-theme="dark"] {
            --bg-body: #0e1626;
            --bg-card: #1a2538;
            --bg-header: #1a2538;
            --bg-footer: #1a2538;
            --bg-progress-track: #2d3a50;
            --bg-input: #253249;
            --bg-hover: #23304a;
            --bg-checked: #1a332a;
            --bg-card-header: #1f2d44;
            --text-primary: #e8edf5;
            --text-secondary: #b0c0d8;
            --text-muted: #6a7f9a;
            --border-color: #2d3e58;
            --shadow-card: 0 4px 16px rgba(0, 0, 0, 0.4);
            --shadow-hover: 0 8px 28px rgba(0, 0, 0, 0.6);
            --accent: #5a9af0;
            --accent-hover: #7ab4f8;
            --accent-light: #1a3350;
            --accent-text: #6aacf5;
            --success: #4caf7a;
            --success-bg: #1a3a2e;
            --success-light: #66c992;
            --danger: #e87070;
            --danger-bg: #3d2222;
            --warning: #d4a830;
            --warning-bg: #3d3220;
            --header-blur: rgba(26, 37, 56, 0.92);
        }

        /* ============================================================
                   Reset & Base
                   ============================================================ */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html {
            scroll-behavior: smooth;
        }
        body {
            font-family: var(--font);
            background: var(--bg-body);
            color: var(--text-primary);
            transition: background var(--transition), color var(--transition);
            min-height: 100vh;
            padding: 0;
            margin: 0;
            line-height: 1.5;
            -webkit-tap-highlight-color: transparent;
        }
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-progress-track);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--text-muted);
            border-radius: 10px;
        }

        /* ============================================================
                   Layout
                   ============================================================ */
        .app {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 14px 14px 90px;
            transition: padding 0.3s ease;
        }

        /* ============================================================
                   Header
                   ============================================================ */
        .app-header {
            background: var(--bg-header);
            border-radius: var(--radius);
            padding: 14px 20px 12px;
            margin-bottom: 16px;
            box-shadow: var(--shadow-card);
            transition: background var(--transition), box-shadow var(--transition), opacity 0.3s ease, transform 0.3s ease;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(12px);
            background: var(--header-blur);
        }
        .header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
        }
        .header-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
        }
        .header-brand .icon {
            font-size: 26px;
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .btn-theme {
            background: var(--bg-input);
            border: none;
            border-radius: 50%;
            width: 38px;
            height: 38px;
            font-size: 19px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background var(--transition), transform 0.15s;
            color: var(--text-secondary);
            border: 1px solid transparent;
            text-decoration: none;
        }
        .btn-theme:hover {
            background: var(--border-color);
            transform: scale(1.04);
        }
        .btn-theme:active {
            transform: scale(0.92);
        }

        /* ============================================================
                   Demo Controls (Navigation + Actions)
                   ============================================================ */
        .demo-controls {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 14px 18px 16px;
            margin-bottom: 16px;
            box-shadow: var(--shadow-card);
            border: 1px solid var(--border-color);
            transition: background var(--transition), border-color var(--transition), all 0.3s ease;
        }
        .demo-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
        }
        .demo-nav .btn-nav {
            padding: 8px 18px;
            border: none;
            border-radius: var(--radius-sm);
            background: var(--bg-input);
            color: var(--text-primary);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background var(--transition), transform 0.1s;
            font-family: var(--font);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            border: 1px solid transparent;
            min-height: 44px;
            touch-action: manipulation;
        }
        .demo-nav .btn-nav:hover {
            background: var(--border-color);
        }
        .demo-nav .btn-nav:active {
            transform: scale(0.95);
        }
        .demo-nav .btn-nav:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }
        .demo-nav .demo-info {
            text-align: center;
            flex: 1;
            min-width: 120px;
        }
        .demo-nav .demo-info .name {
            font-weight: 600;
            font-size: 17px;
            color: var(--text-primary);
        }
        .demo-nav .demo-info .name .status-icon {
            margin-left: 8px;
            font-size: 18px;
        }
        .demo-nav .demo-info .index {
            font-size: 13px;
            color: var(--text-muted);
            margin-left: 6px;
            font-weight: 400;
        }
        .demo-nav .demo-info .sub {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 2px;
        }
        .demo-nav .demo-info .sub .highlight {
            font-weight: 600;
            color: var(--accent-text);
        }

        .demo-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border-color);
            transition: all 0.3s ease;
        }
        .demo-actions .btn-action {
            padding: 7px 18px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            background: var(--bg-secondary, #fff);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            color: var(--text-secondary);
            transition: all var(--transition);
            font-family: var(--font);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            min-height: 40px;
            touch-action: manipulation;
        }
        [data-theme="dark"] .demo-actions .btn-action {
            background: var(--bg-input);
        }
        .demo-actions .btn-action:hover {
            background: var(--bg-hover);
            border-color: var(--text-muted);
        }
        .demo-actions .btn-action.primary {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }
        .demo-actions .btn-action.primary:hover {
            background: var(--accent-hover);
            border-color: var(--accent-hover);
        }
        .demo-actions .btn-action.success {
            background: var(--success);
            color: #fff;
            border-color: var(--success);
        }
        .demo-actions .btn-action.success:hover {
            background: var(--success-light);
            border-color: var(--success-light);
        }

        /* 退出全屏按钮：默认隐藏，全屏模式下显示 */
        /* 需要提高选择器优先级，否则会被 .demo-nav .btn-nav 的 display 覆盖 */
        .demo-nav .exit-fullscreen-btn {
            display: none;
        }

        /* ============================================================
                   Content — Process Card
                   ============================================================ */
        .process-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            box-shadow: var(--shadow-card);
            border: 1px solid var(--border-color);
            overflow: hidden;
            transition: background var(--transition), box-shadow var(--transition), border-color var(--transition);
        }
        .process-card:hover {
            box-shadow: var(--shadow-hover);
        }
        .process-card .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 20px;
            background: var(--bg-card-header);
            border-bottom: 1px solid var(--border-color);
            transition: background var(--transition), border-color var(--transition);
            flex-wrap: wrap;
            gap: 8px;
        }
        .process-card .card-header .title {
            font-weight: 600;
            font-size: 17px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-primary);
        }
        .process-card .card-header .title .icon-folder {
            font-size: 20px;
        }
        .process-card .card-header .title .done-badge {
            font-size: 13px;
            font-weight: 500;
            background: var(--success-bg);
            color: var(--success);
            padding: 0 14px;
            border-radius: 20px;
            line-height: 24px;
            margin-left: 4px;
        }
        .process-card .card-header .title .done-badge.pending {
            background: var(--warning-bg);
            color: var(--warning);
        }
        .process-card .card-header .meta {
            font-size: 13px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .process-card .card-header .meta .mini-bar {
            width: 70px;
            height: 4px;
            background: var(--bg-progress-track);
            border-radius: 6px;
            overflow: hidden;
        }
        .process-card .card-header .meta .mini-bar .fill {
            height: 100%;
            width: 0%;
            background: var(--accent);
            border-radius: 6px;
            transition: width 0.4s ease;
        }
        .process-card .card-header .meta .pct {
            font-weight: 600;
            min-width: 36px;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        .process-card .card-body {
            padding: 0;
        }

        /* ============================================================
                   Record Item
                   ============================================================ */
        .record-item {
            display: flex;
            align-items: center;
            padding: 11px 20px;
            border-bottom: 1px solid var(--border-color);
            transition: background var(--transition), border-color var(--transition);
            gap: 12px;
            cursor: pointer;
            min-height: 50px;
            touch-action: manipulation;
        }
        .record-item:last-child {
            border-bottom: none;
        }
        .record-item:hover {
            background: var(--bg-hover);
        }
        .record-item.checked {
            background: var(--bg-checked);
        }
        .record-item.checked:hover {
            background: var(--bg-checked);
            filter: brightness(0.97);
        }
        [data-theme="dark"] .record-item.checked {
            background: rgba(76, 175, 122, 0.10);
        }
        [data-theme="dark"] .record-item.checked:hover {
            background: rgba(76, 175, 122, 0.16);
        }

        .record-item .cb-wrap {
            flex-shrink: 0;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .record-item .cb-wrap input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: var(--accent);
            cursor: pointer;
            flex-shrink: 0;
            border-radius: 4px;
            border: 2px solid var(--border-color);
            transition: all var(--transition);
        }
        .record-item .cb-wrap input[type="checkbox"]:checked {
            border-color: var(--accent);
        }

        .record-item .info {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .record-item .info .name {
            font-size: 15px;
            font-weight: 500;
            color: var(--text-primary);
            word-break: break-word;
            line-height: 1.4;
        }
        .record-item .info .meta {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px 14px;
            font-size: 12px;
            color: var(--text-muted);
        }
        .record-item .info .meta .dept {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .record-item .info .meta .dept::before {
            content: "🏢";
            font-size: 12px;
        }
        .record-item .info .meta .id-tag {
            font-weight: 500;
            background: var(--bg-progress-track);
            padding: 0 10px;
            border-radius: 12px;
            font-size: 11px;
            line-height: 20px;
            color: var(--text-muted);
        }
        .record-item .info .meta .opt-tag {
            font-size: 11px;
            background: var(--warning-bg);
            color: var(--warning);
            padding: 0 10px;
            border-radius: 12px;
            line-height: 20px;
            font-weight: 500;
        }

        /* ============================================================
                   Empty State
                   ============================================================ */
        .empty-state {
            text-align: center;
            padding: 48px 20px;
            color: var(--text-muted);
        }
        .empty-state .icon {
            font-size: 52px;
            margin-bottom: 12px;
        }
        .empty-state .text {
            font-size: 16px;
        }

        /* ============================================================
                   Footer
                   ============================================================ */
        .app-footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg-footer);
            border-top: 1px solid var(--border-color);
            padding: 10px 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            z-index: 30;
            transition: background var(--transition), border-color var(--transition), opacity 0.3s ease, transform 0.3s ease;
            backdrop-filter: blur(10px);
            background: var(--header-blur);
            border: 1px solid var(--border-color);
            border-bottom: none;
            border-radius: var(--radius) var(--radius) 0 0;
            margin: 0 10px;
            font-size: 13px;
            color: var(--text-muted);
        }
        .app-footer .dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--success);
            animation: pulse-dot 2s infinite;
            margin-right: 6px;
        }
        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.3;
            }
        }

        /* ============================================================
                   FULLSCREEN MODE
                   ============================================================ */
        .app.fullscreen {
            padding: 0 !important;
            max-width: 100% !important;
            min-height: 100vh;
            min-height: 100dvh;
        }
        .app.fullscreen .app-header {
            display: none !important;
        }
        .app.fullscreen .app-footer {
            display: none !important;
        }
        .app.fullscreen .demo-actions {
            display: none !important;
        }
        .app.fullscreen .demo-controls {
            background: transparent !important;
            box-shadow: none !important;
            border: none !important;
            padding: 8px 12px 12px !important;
            margin-bottom: 0 !important;
            border-radius: 0 !important;
        }
        .app.fullscreen .demo-nav .btn-nav {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-card);
        }
        .app.fullscreen .demo-nav .demo-info .name {
            font-size: 18px;
        }
        .app.fullscreen .process-card {
            border-radius: 0 !important;
            box-shadow: none !important;
            border-left: none !important;
            border-right: none !important;
            border-top: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
        }
        .app.fullscreen .process-card .card-header {
            border-radius: 0 !important;
        }
        .app.fullscreen .exit-fullscreen-btn {
            display: inline-flex !important;
        }
        .app.fullscreen .record-item {
            padding: 14px 20px;
            min-height: 56px;
        }
        .app.fullscreen .record-item .info .name {
            font-size: 16px;
        }
        .app.fullscreen .record-item .cb-wrap input[type="checkbox"] {
            width: 22px;
            height: 22px;
        }

        /* 全屏模式下退出按钮特殊样式 */
        .exit-fullscreen-btn {
            background: var(--bg-input) !important;
            border-color: var(--border-color) !important;
        }
        .exit-fullscreen-btn:hover {
            background: var(--border-color) !important;
        }

        /* ============================================================
                   Toast
                   ============================================================ */
        .toast-container {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999;
            pointer-events: none;
            max-width: 92%;
            width: 400px;
        }
        .toast {
            background: var(--bg-card);
            color: var(--text-primary);
            padding: 12px 24px;
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow-hover);
            border: 1px solid var(--border-color);
            font-size: 14px;
            font-weight: 500;
            opacity: 0;
            transform: translateY(18px) scale(0.96);
            transition: all 0.3s ease;
            pointer-events: auto;
            text-align: center;
            backdrop-filter: blur(8px);
        }
        .toast.show {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
        .toast.success {
            border-left: 4px solid var(--success);
        }
        .toast.info {
            border-left: 4px solid var(--accent);
        }
        .toast.warning {
            border-left: 4px solid var(--warning);
        }

        /* ============================================================
                   Responsive
                   ============================================================ */
        @media (max-width: 720px) {
            .app {
                padding: 10px 10px 80px;
            }
            .app-header {
                padding: 12px 14px 10px;
                border-radius: var(--radius-sm);
            }
            .header-brand {
                font-size: 17px;
            }
            .header-brand .icon {
                font-size: 22px;
            }
            /* 标题与功能按钮始终保持同一行 */
            .header-row {
                flex-wrap: nowrap;
            }
            .header-brand {
                min-width: 0;
            }
            .header-actions {
                flex-shrink: 0;
            }
            .btn-theme {
                width: 34px;
                height: 34px;
                font-size: 17px;
            }
            .demo-controls {
                padding: 10px 12px 12px;
                border-radius: var(--radius-sm);
            }
            /* 手机端导航栏吸顶，滚动时始终可操作 */
            .app:not(.fullscreen) .demo-controls {
                position: -webkit-sticky;
                position: sticky;
                top: 6px;
                z-index: 20;
                backdrop-filter: blur(10px);
            }
            .demo-nav .btn-nav {
                padding: 6px 14px;
                font-size: 13px;
                min-height: 40px;
            }
            .demo-nav .demo-info .name {
                font-size: 15px;
            }
            .demo-nav .demo-info .sub {
                font-size: 12px;
            }
            .demo-actions .btn-action {
                font-size: 12px;
                padding: 5px 12px;
                min-height: 36px;
            }
            .process-card .card-header {
                padding: 10px 14px;
            }
            .process-card .card-header .title {
                font-size: 15px;
            }
            .process-card .card-header .meta {
                font-size: 12px;
                gap: 8px;
            }
            .process-card .card-header .meta .mini-bar {
                width: 50px;
            }
            .record-item {
                padding: 8px 14px;
                min-height: 44px;
                gap: 10px;
            }
            .record-item .info .name {
                font-size: 14px;
            }
            .record-item .info .meta {
                font-size: 11px;
                gap: 4px 10px;
            }
            .record-item .cb-wrap input[type="checkbox"] {
                width: 18px;
                height: 18px;
            }
            .app-footer {
                padding: 8px 14px;
                margin: 0 6px;
                border-radius: var(--radius-sm) var(--radius-sm) 0 0;
                font-size: 12px;
            }
            .toast {
                font-size: 13px;
                padding: 10px 16px;
            }
            .toast-container {
                bottom: 74px;
                width: 94%;
            }
            /* 全屏手机适配 */
            .app.fullscreen .demo-nav {
                flex-wrap: wrap;
                justify-content: center;
            }
            .app.fullscreen .demo-nav .demo-info {
                order: -1;
                flex: 0 0 100%;
                text-align: center;
                margin-bottom: 4px;
            }
            .app.fullscreen .demo-nav .btn-nav {
                flex: 1 1 0;
                min-width: 0;
                justify-content: center;
                padding: 8px 12px;
                font-size: 14px;
                min-height: 44px;
            }
            /* 退出全屏按钮按内容自适应宽度，避免被等宽挤压 */
            .app.fullscreen .demo-nav .exit-fullscreen-btn {
                flex: 0 0 auto;
                order: 3;
            }
            .app.fullscreen .record-item {
                padding: 12px 14px;
                min-height: 50px;
            }
            .app.fullscreen .record-item .info .name {
                font-size: 15px;
            }
            .app.fullscreen .demo-nav .demo-info .name {
                font-size: 16px;
            }
        }

            optional: false
        }];

        // ========================================================================
        // STATE
        // ========================================================================
        let checkedIds = new Set();
        let theme = 'light';
        let currentProcessIndex = 0;

        // DOM refs
        const $ = (s) => document.querySelector(s);
        const $$ = (s) => document.querySelectorAll(s);

        const appEl = $('.app');
        const contentEl = $('#content');
        const themeToggle = $('#themeToggle');
        const toastEl = $('#toastEl');
        const toastContainer = $('#toastContainer');
        const footerInfo = $('#footerInfo');

        const demoName = $('#demoName');
        const demoIndex = $('#demoIndex');
        const demoStatusIcon = $('#demoStatusIcon');
        const demoProgressText = $('#demoProgressText');
        const demoSub = $('#demoSub');
        const demoPrev = $('#demoPrev');
        const demoNext = $('#demoNext');
        const fullscreenBtn = $('#fullscreenBtn');
        const exitFullscreenBtn = $('#exitFullscreenBtn');

        // ========================================================================
        // HELPERS
        // ========================================================================
        function getProcessGroups() {
            const map = new Map();
            RECORDS.forEach(r => {
                if (!map.has(r.process)) map.set(r.process, []);
                map.get(r.process).push(r);
            });
            return map;
        }

        function getProcessList() {
            return Array.from(getProcessGroups().keys());
        }

        function getProcessItems(processName) {
            return RECORDS.filter(r => r.process === processName);
        }

        function getProcessStats(processName) {
            const items = getProcessItems(processName);
            const total = items.length;
            const done = items.filter(r => checkedIds.has(r.id)).length;
            return { total, done, percent: total === 0 ? 0 : Math.round((done / total) * 100) };
        }

        function getTotalStats() {
            const total = RECORDS.length;
            const done = checkedIds.size;
            const pending = total - done;
            const percent = total === 0 ? 0 : Math.round((done / total) * 100);
            return { total, done, pending, percent };
        }

        function getCurrentProcessName() {
            const list = getProcessList();
            if (list.length === 0) return null;
            // 确保索引合法（限制在区间内，不循环）
            let idx = currentProcessIndex;
            if (idx < 0) idx = 0;
            if (idx >= list.length) idx = list.length - 1;
            currentProcessIndex = idx;
            return list[idx];
        }

        // ========================================================================
        // RENDER
        // ========================================================================
        function render() {
            const processName = getCurrentProcessName();
            const list = getProcessList();

            if (!processName || list.length === 0) {
                contentEl.innerHTML = `
                        <div class="empty-state">
                            <div class="icon">📭</div>
                            <div class="text">没有流程数据</div>
                        </div>
                    `;
                updateDemoNav(null);
                updateFooter();
                return;
            }

            const items = getProcessItems(processName);
            const stats = getProcessStats(processName);

            const isComplete = stats.done === stats.total && stats.total > 0;
            const badgeClass = isComplete ? '' : 'pending';
            const badgeText = isComplete ? '✅ 已完成' : '⏳ 进行中';

            let itemsHtml = items.map(r => {
                const checked = checkedIds.has(r.id);
                const cls = checked ? 'record-item checked' : 'record-item';
                const optTag = r.optional ? '<span class="opt-tag">可选</span>' : '';
                return `
                        <div class="${cls}" data-id="${r.id}" data-checked="${checked}">
                            <div class="cb-wrap">
                                <input type="checkbox" ${checked ? 'checked' : ''} data-id="${r.id}" />
                            </div>
                            <div class="info">
                                <span class="name">${escHtml(r.name)}</span>
                                <span class="meta">
                                    <span class="id-tag">#${r.id}</span>
                                    <span class="dept">${escHtml(r.department)}</span>
                                    ${optTag}
                                </span>
                            </div>
                        </div>
                    `;
            }).join('');

            const cardHtml = `
                    <div class="process-card" data-process="${processName}">
                        <div class="card-header">
                            <span class="title">
                                <span class="icon-folder">📂</span>
                                ${processName}
                                <span class="done-badge ${badgeClass}">${badgeText}</span>
                            </span>
                            <span class="meta">
                                <span>${stats.done}/${stats.total}</span>
                                <span class="mini-bar"><span class="fill" style="width:${stats.percent}%;"></span></span>
                                <span class="pct">${stats.percent}%</span>
                            </span>
                        </div>
                        <div class="card-body">
                            ${itemsHtml}
                        </div>
                    </div>
                `;

            contentEl.innerHTML = cardHtml;
            updateDemoNav(processName);
            updateFooter();
            saveState();
        }

        function updateDemoNav(processName) {
            const list = getProcessList();
            const total = list.length;
            const idx = currentProcessIndex;

            // 第一个文件夹禁用上一步；下一步始终可前进（循环）
            demoPrev.disabled = idx <= 0;
            demoNext.disabled = false;

            if (!processName || total === 0) {
                demoName.textContent = '—';
                demoIndex.textContent = '0/0';
                demoStatusIcon.textContent = '⚪';
                demoProgressText.textContent = '0/0';
                demoSub.innerHTML = '当前流程 · <span class="highlight">0/0</span> 已完成';
                return;
            }

            const stats = getProcessStats(processName);
            const isComplete = stats.done === stats.total && stats.total > 0;
            demoName.textContent = processName;
            demoIndex.textContent = `${idx + 1}/${total}`;
            demoStatusIcon.textContent = isComplete ? '✅' : '⚪';
            demoStatusIcon.style.color = isComplete ? 'var(--success)' : 'var(--warning)';
            demoProgressText.textContent = `${stats.done}/${stats.total}`;
            demoSub.innerHTML = `当前流程 · <span class="highlight">${stats.done}/${stats.total}</span> 已完成  ·  ${stats.percent}%`;
        }

        function updateFooter() {
            const stats = getTotalStats();
            footerInfo.textContent = `数据自动保存 · 共 ${stats.total} 条记录 · 已核对 ${stats.done} 条`;
        }

        function escHtml(text) {
            const d = document.createElement('div');
            d.textContent = text;
            return d.innerHTML;
        }

        // ========================================================================
        // EVENTS — Checkbox & Click
        // ========================================================================
        function handleCheckboxChange(e) {
            const cb = e.target;
            if (cb.type !== 'checkbox') return;
            const id = parseInt(cb.dataset.id, 10);
            if (cb.checked) checkedIds.add(id);
            else checkedIds.delete(id);

            const item = cb.closest('.record-item');
            if (item) {
                item.classList.toggle('checked', cb.checked);
                item.dataset.checked = cb.checked ? 'true' : 'false';
            }
            render();
        }

        function handleItemClick(e) {
            const item = e.target.closest('.record-item');
            if (!item) return;
            if (e.target.closest('input[type="checkbox"]')) return;
            const cb = item.querySelector('input[type="checkbox"]');
            if (cb) {
                cb.checked = !cb.checked;
                cb.dispatchEvent(new Event('change', { bubbles: true }));
            }
        }

        // ========================================================================
        // NAVIGATION
        // ========================================================================
        function goToProcess(index) {
            const list = getProcessList();
            if (list.length === 0) return;
            // 不循环：超出范围则不跳转
            if (index < 0 || index >= list.length) return;
            currentProcessIndex = index;
            render();
        }

        function prevProcess() {
            const list = getProcessList();
            if (list.length === 0) return;
            // 第一个文件夹不循环
            if (currentProcessIndex <= 0) return;
            goToProcess(currentProcessIndex - 1);
        }

        function nextProcess() {
            const list = getProcessList();
            if (list.length === 0) return;
            // 最后一个文件夹可继续跳转到第一个（循环前进）
            const newIdx = (currentProcessIndex + 1) % list.length;
            goToProcess(newIdx);
        }

        // ========================================================================
        // ACTIONS
        // ========================================================================

        // ========================================================================
        // FULLSCREEN
        // ========================================================================
        function toggleFullscreen() {
            appEl.classList.toggle('fullscreen');
            const isFull = appEl.classList.contains('fullscreen');
            // 退出全屏按钮通过 CSS 控制显示隐藏，无需额外操作
            showToast(isFull ? '⛶ 进入全屏模式' : '⛶ 退出全屏模式', 'info', 1200);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ========================================================================
        // THEME
        // ========================================================================
        function applyTheme() {
            const isDark = theme === 'dark';
            document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
            themeToggle.textContent = isDark ? '☀️' : '🌙';
            themeToggle.setAttribute('aria-label', isDark ? '切换到白天模式' : '切换到黑夜模式');
        }

        function toggleTheme() {
            theme = theme === 'light' ? 'dark' : 'light';
            applyTheme();
            saveState();
            showToast(theme === 'dark' ? '🌙 黑夜模式' : '☀️ 白天模式', 'info', 1000);
        }

        // ========================================================================
        // TOAST
        // ========================================================================
        let toastTimer = null;

        function showToast(message, type = 'info', duration = 1600) {
            if (toastTimer) clearTimeout(toastTimer);
            toastEl.textContent = message;
            toastEl.className = 'toast ' + type;
            void toastEl.offsetWidth;
            toastEl.classList.add('show');
            toastTimer = setTimeout(() => {
                toastEl.classList.remove('show');
            }, duration);
        }

        // ========================================================================
        // STORAGE
        // ========================================================================
        function saveState() {
            try {
                const data = {
                    checkedIds: Array.from(checkedIds),
                    theme: theme,
                    currentProcessIndex: currentProcessIndex,
                    version: '2.1'
                };
                localStorage.setItem('dhr_checklist_v2', JSON.stringify(data));
            } catch (_) { /* ignore */ }
        }

        function loadState() {
            try {
                const raw = localStorage.getItem('dhr_checklist_v2');
                if (!raw) return;
                const data = JSON.parse(raw);
                if (data.checkedIds && Array.isArray(data.checkedIds)) {
                    checkedIds = new Set(data.checkedIds);
                    const validIds = new Set(RECORDS.map(r => r.id));
                    for (const id of checkedIds) {
                        if (!validIds.has(id)) checkedIds.delete(id);
                    }
                }
                if (data.theme === 'dark' || data.theme === 'light') {
                    theme = data.theme;
                }
                if (typeof data.currentProcessIndex === 'number' && data.currentProcessIndex >= 0) {
                    const list = getProcessList();
                    if (list.length > 0) {
                        currentProcessIndex = data.currentProcessIndex % list.length;
                    }
                }
                applyTheme();
            } catch (_) { /* ignore */ }
        }

        // ========================================================================
        // KEYBOARD
        // ========================================================================
        function handleKeydown(e) {
            if (e.key === 'ArrowLeft') {
                e.preventDefault();
                prevProcess();
            } else if (e.key === 'ArrowRight') {
                e.preventDefault();
                nextProcess();
            } else if (e.key === 'Escape' && appEl.classList.contains('fullscreen')) {
                // 退出全屏
                appEl.classList.remove('fullscreen');
                showToast('⛶ 退出全屏', 'info', 800);
            }
        }

        // ========================================================================
        // INIT
        // ========================================================================
        function init() {
            loadState();
            render();

            // Events: checkbox & click
            contentEl.addEventListener('change', handleCheckboxChange);
            contentEl.addEventListener('click', handleItemClick);

            // Theme
            themeToggle.addEventListener('click', toggleTheme);

            // Navigation
            demoPrev.addEventListener('click', prevProcess);
            demoNext.addEventListener('click', nextProcess);

            // Fullscreen
            fullscreenBtn.addEventListener('click', toggleFullscreen);
            exitFullscreenBtn.addEventListener('click', toggleFullscreen);

            // Keyboard
            document.addEventListener('keydown', handleKeydown);

            // Save on unload
            window.addEventListener('beforeunload', saveState);

            // Welcome toast
            setTimeout(() => {
                const stats = getTotalStats();
                if (stats.done === 0) {
                    showToast(`📋 共 ${stats.total} 条记录，使用 ← → 切换流程`, 'info', 2800);
                } else {
                    showToast(`📋 已恢复 ${stats.done}/${stats.total} 条勾选`, 'info', 2000);
                }
            }, 350);

            console.log('📋 DHR 核对清单 v2.1 · 顺序导航 + 全屏模式');
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>

</body>
</html>
