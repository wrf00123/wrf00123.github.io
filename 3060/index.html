<!DOCTYPE html>
<html lang="zh-CN" data-theme="ios-light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="QMS">
    <meta name="description" content="网址收藏库 · 高效分类导航，支持 12 款皮肤、收藏与快捷键。">
    <title>网址收藏库 · V1.0.0</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%23007aff'/%3E%3Cpath d='M50 22l7 16.5L73.5 45 57 52l-7 16.5L43 52l-16.5-7L43 38.5z' fill='%23fff'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script>
        // 提前应用皮肤，避免刷新时的主题闪烁
        (function () {
            var SKIN_IDS = [
                'ios-light', 'ocean', 'forest', 'sakura', 'sunset', 'graphite', 'lavender',
                'ios-dark', 'midnight', 'nebula', 'nord', 'cyber'
            ];
            var skin = null;
            try {
                skin = localStorage.getItem('bookmarks-skin');
                if (!skin || SKIN_IDS.indexOf(skin) === -1) {
                    skin = localStorage.getItem('bookmarks-theme') === 'dark' ? 'ios-dark' : 'ios-light';
                }
            } catch (e) {
                skin = 'ios-light';
            }
            document.documentElement.setAttribute('data-theme', skin);
        })();
    </script>
</head>
<body>
    <!-- 背景装饰光晕 -->
    <div class="ambient" aria-hidden="true">
        <span class="blob blob-1"></span>
        <span class="blob blob-2"></span>
        <span class="blob blob-3"></span>
    </div>

    <div class="container">
        <!-- 顶部栏 -->
        <header class="header">
            <!-- 品牌 -->
            <a class="brand" href="#" id="brandHome" title="回到首页">
                <span class="brand-mark"><i class="fas fa-compass"></i></span>
                <span class="brand-text">
                    <span class="brand-title">网址收藏库</span>
                    <span class="brand-sub">QMS · 效率导航</span>
                </span>
            </a>

            <!-- 搜索框 -->
            <div class="search-container" id="searchBox">
                <i class="fas fa-search search-icon"></i>
                <input type="text" class="search-input" id="searchInput" autocomplete="off" spellcheck="false"
                       placeholder="搜索网址名称或用途…" aria-label="搜索网址">
                <span class="search-hint"><kbd>/</kbd></span>
                <button class="search-clear" id="searchClear" type="button"
                        title="清除搜索（Esc）" aria-label="清除搜索">
                    <i class="fas fa-xmark"></i>
                </button>
            </div>

            <!-- 操作按钮：设置 → 皮肤 → 网址征集 -->
            <div class="header-actions">
                <button class="icon-btn" id="settingsToggle" type="button"
                        title="设置（收藏 / 快捷键说明）" aria-label="设置">
                    <i class="fas fa-sliders"></i>
                </button>
                <button class="icon-btn" id="skinToggle" type="button"
                        title="更换皮肤（T）" aria-label="更换皮肤">
                    <i class="fas fa-palette"></i>
                </button>
            </div>

            <!-- 设置面板：收藏入口 + 菜单栏开关 + 快捷键说明 -->
            <div class="panel settings-panel" id="settingsPanel" role="dialog" aria-label="设置">
                <div class="panel-header">
                    <span class="panel-title"><i class="fas fa-sliders"></i> 设置</span>
                    <span class="panel-badge">V1.0.0</span>
                </div>
                <div class="panel-body">
                    <!-- 收藏入口 -->
                    <button class="settings-row" id="settingsFavorites" type="button">
                        <span class="settings-row-icon"><i class="fas fa-heart"></i></span>
                        <span class="settings-row-body">
                            <span class="settings-row-title">我的收藏</span>
                            <span class="settings-row-desc">查看已收藏的网址（F）</span>
                        </span>
                        <span class="settings-row-badge" id="settingsFavCount">0</span>
                    </button>

                    <!-- 底部一级菜单栏开关 -->
                    <button class="settings-row" id="settingsTaskbar" type="button"
                            role="switch" aria-checked="true">
                        <span class="settings-row-icon"><i class="fas fa-bars-staggered"></i></span>
                        <span class="settings-row-body">
                            <span class="settings-row-title">显示底部菜单栏</span>
                            <span class="settings-row-desc">关闭后可从底部手柄重新唤起（H）</span>
                        </span>
                        <span class="switch" id="settingsTaskbarSwitch"><span class="switch-knob"></span></span>
                    </button>

                    <!-- 快捷键使用说明：点击打开独立弹窗 -->
                    <button class="settings-row" id="settingsShortcuts" type="button">
                        <span class="settings-row-icon"><i class="fas fa-keyboard"></i></span>
                        <span class="settings-row-body">
                            <span class="settings-row-title">快捷键使用说明</span>
                            <span class="settings-row-desc">查看全部快捷键（Shift + ?）</span>
                        </span>
                        <span class="settings-row-arrow"><i class="fas fa-chevron-right"></i></span>
                    </button>

                    <!-- 作者与版本 -->
                    <div class="settings-footer">
                        <span><i class="fas fa-user-pen"></i> 作者：QMS</span>
                        <span><i class="fas fa-code-branch"></i> 系统版本：V1.0.0</span>
                    </div>
                </div>
            </div>

            <!-- 皮肤面板 -->
            <div class="panel skin-panel" id="skinPanel" role="dialog" aria-label="选择皮肤">
                <div class="panel-header">
                    <span class="panel-title"><i class="fas fa-palette"></i> 选择皮肤</span>
                    <span class="panel-badge" id="skinCountTip">12 款主题</span>
                </div>
                <div class="panel-body">
                    <div class="skin-grid" id="skinGrid">
                        <!-- 皮肤选项通过 JavaScript 动态生成 -->
                    </div>
                </div>
            </div>
        </header>

        <!-- 网址卡片区域 -->
        <main id="bookmarksContainer">
            <!-- 分类与卡片通过 JavaScript 动态生成 -->
        </main>
    </div>

    <!-- 底部一级菜单 -->
    <nav class="bottom-menu" id="bottomMenu">
        <!-- 菜单项通过 JavaScript 动态生成 -->
    </nav>

    <!-- 菜单栏折叠 / 唤起手柄 -->
    <button class="taskbar-handle" id="taskbarHandle" type="button"
            title="隐藏底部菜单栏（H）" aria-label="隐藏底部菜单栏">
        <i class="fas fa-chevron-down"></i>
    </button>

    <!-- 更多分类弹出面板 -->
    <div class="more-menu" id="moreMenu">
        <div class="more-menu-header">
            <div class="more-menu-title">所有分类</div>
            <div class="more-menu-search-container">
                <i class="fas fa-search more-menu-search-icon"></i>
                <input type="text" class="more-menu-search" id="moreMenuSearch"
                       placeholder="搜索分类或网址…" aria-label="搜索分类">
            </div>
        </div>
        <div class="more-menu-categories" id="moreCategories">
            <!-- 更多分类通过 JavaScript 动态生成 -->
        </div>
    </div>

    <!-- 轻提示 -->
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <!-- 快捷键使用说明：独立弹窗 -->
    <div class="modal-backdrop" id="shortcutModal" role="dialog" aria-modal="true"
         aria-label="快捷键使用说明" aria-hidden="true">
        <div class="modal">
            <div class="modal-header">
                <span class="modal-title"><i class="fas fa-keyboard"></i> 快捷键使用说明</span>
                <button class="modal-close" id="shortcutModalClose" type="button" aria-label="关闭弹窗">
                    <i class="fas fa-xmark"></i>
                </button>
            </div>
            <div class="modal-body">
                <ul class="shortcut-list">
                    <li>
                        <span class="keys"><kbd>/</kbd></span>
                        <span class="shortcut-desc">聚焦搜索框</span>
                    </li>
                    <li>
                        <span class="keys"><kbd>T</kbd></span>
                        <span class="shortcut-desc">切换皮肤（依次循环）</span>
                    </li>
                    <li>
                        <span class="keys"><kbd>F</kbd></span>
                        <span class="shortcut-desc">查看我的收藏</span>
                    </li>
                    <li>
                        <span class="keys"><kbd>Shift</kbd><kbd>?</kbd></span>
                        <span class="shortcut-desc">打开快捷键使用说明</span>
                    </li>
                    <li>
                        <span class="keys"><kbd>Esc</kbd></span>
                        <span class="shortcut-desc">清除搜索 / 关闭面板</span>
                    </li>
                    <li>
                        <span class="keys"><kbd>H</kbd></span>
                        <span class="shortcut-desc">显示 / 隐藏底部菜单栏</span>
                    </li>
                </ul>
                <div class="settings-note">
                    <i class="fas fa-circle-info"></i>
                    <span>在输入框中输入文字时，字母快捷键会自动暂停响应。</span>
                </div>
            </div>
            <div class="modal-footer">
                <span><i class="fas fa-user-pen"></i> 作者：QMS</span>
                <span><i class="fas fa-code-branch"></i> 系统版本：V1.0.0</span>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
